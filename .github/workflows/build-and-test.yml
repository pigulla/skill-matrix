name: Build and Test

on: [ push ]

env:
  NODE_ENV: ci

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - run: docker pull --quiet postgres:18-alpine

      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - run: npm ci
#      - run: npm i --no-save @biomejs/cli-linux-x64 @swc/core @rollup/rollup-linux-x64-gnu
      - run: npm run test
      - run: npm run build
